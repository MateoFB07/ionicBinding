<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Gestión Multiplataforma</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
  <div class="contenedor-login">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Acceso al sistema</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="miFormulario" (ngSubmit)="entrar()">
          
          <!-- Campo Email -->
          <ion-input
            type="email"
            label="Email"
            labelPlacement="floating"
            fill="outline"
            formControlName="email"
            placeholder="admin@test.com"
            class="ion-margin-bottom"
          ></ion-input>

          <div *ngIf="miFormulario.get('email')?.touched && miFormulario.get('email')?.invalid" class="mensaje-error">
            <ion-text color="danger" *ngIf="miFormulario.get('email')?.hasError('required')">
              El email es obligatorio.
            </ion-text>
            <ion-text color="danger" *ngIf="miFormulario.get('email')?.hasError('email')">
              Formato de email no válido.
            </ion-text>
          </div>

          <!-- Campo Contraseña -->
          <ion-input
            type="password"
            label="Contraseña"
            labelPlacement="floating"
            fill="outline"
            formControlName="password"
            class="ion-margin-bottom"
          ></ion-input>

          <div *ngIf="miFormulario.get('password')?.touched && miFormulario.get('password')?.invalid" class="mensaje-error">
            <ion-text color="danger" *ngIf="miFormulario.get('password')?.hasError('required')">
              La contraseña es obligatoria.
            </ion-text>
            <ion-text color="danger" *ngIf="miFormulario.get('password')?.hasError('minlength')">
              Mínimo 6 caracteres.
            </ion-text>
          </div>

          <!-- Botón de acceso -->
          <ion-button expand="block" type="submit" [disabled]="cargando" class="ion-margin-top">
            <ion-spinner *ngIf="cargando"></ion-spinner>
            <span *ngIf="!cargando">Iniciar Sesión</span>
          </ion-button>

        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
