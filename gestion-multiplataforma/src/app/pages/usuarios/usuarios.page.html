<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio"></ion-back-button>
    </ion-buttons>
    <ion-title>Gestión de Usuarios</ion-title>
  </ion-toolbar>
  <app-navegacion></app-navegacion>
</ion-header>

<ion-content>
  <main class="page-shell">
    <section class="page-heading">
      <div>
        <p class="eyebrow">GESTIÓN DEL EQUIPO</p>
        <h1>Usuarios</h1>
        <p class="page-description">Administra las cuentas, los roles y los datos de tu equipo.</p>
      </div>
      <div class="heading-actions">
        <span class="heading-badge">Panel de administración</span>
        @if (esAdmin) {
          <ion-button routerLink="/usuarios/nuevo" color="primary">
            Nuevo empleado
          </ion-button>
        }
      </div>
    </section>

    @if (cargando()) {
      <div class="loading-state">
        <ion-spinner name="crescent" color="primary"></ion-spinner>
        <p>Cargando datos desde Supabase...</p>
      </div>
    } @else {
      <ion-card class="analytics-card">
        <ion-card-header>
          <ion-card-title>Distribución de plantilla</ion-card-title>
          <ion-card-subtitle>Proporción de empleados por rol</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          <div class="chart-container">
            <canvas #graficoRoles></canvas>
          </div>
        </ion-card-content>
      </ion-card>

      <app-tabla-usuarios
        [datos]="empleados()"
        [esAdmin]="esAdmin"
        (alEliminar)="eliminarEmpleado($event)">
      </app-tabla-usuarios>
    }
  </main>
</ion-content>
