<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Registro
    </ion-title>
    <!-- 6. Botón para alternar entre el modo claro y el modo oscuro. -->
    <ion-button slot="end" fill="clear" (click)="toggleDarkMode()">
      {{ isDarkMode() ? 'Modo claro' : 'Modo oscuro' }}
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Formulario</ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="ion-padding">
    <!-- 10. El formulario se adapta a móviles y centra su contenido en pantallas grandes. -->
    <!-- Enlace del FormGroup definido en TypeScript -->
    <form class="registro-form" [formGroup]="registroForm" (ngSubmit)="onSubmit()">
      <ion-list lines="full">
        <!-- Campo Nombre -->
        <ion-item>
          <ion-input label="Nombre completo" labelPlacement="floating" type="text" formControlName="nombre"
            [errorText]="'El nombre es obligatorio (mín. 3 caracteres).'">
          </ion-input>
        </ion-item>
        <!-- Campo Email con teclado específico para móviles -->
        <ion-item>
          <ion-input label="Correo Electrónico" labelPlacement="floating" type="email" inputmode="email"
            formControlName="email" [errorText]="'Introduzca un email válido.'">
          </ion-input>
        </ion-item>
        <!-- Campo Contraseña -->
        <ion-item>
          <ion-input label="Contraseña" labelPlacement="floating" type="password" formControlName="password"
            [errorText]="'Mínimo 8 caracteres, letras y números.'">
          </ion-input>
        </ion-item>
        <!-- Fecha seleccionada: hoy o cualquier fecha posterior -->
        <ion-item>
          <ion-input label="Fecha" labelPlacement="stacked" type="date" [min]="today" formControlName="fecha"
            [errorText]="'Selecciona hoy o una fecha posterior.'">
          </ion-input>
        </ion-item>
      </ion-list>
      <div class="ion-padding-top">
        <!-- Botón dinámico que responde al Signal -->
        <ion-button expand="block" type="submit" [disabled]="registroForm.invalid || isSubmitting()">
          @if (!isSubmitting()) {
            <span>Registrarse</span>
          }
          @if (isSubmitting()) {
            <ion-spinner name="crescent"></ion-spinner>
          }
        </ion-button>
      </div>
    </form>
    @if (submittedData()) {
      <!-- 7. Descargar en PDF los datos del último formulario enviado (sin contraseña). -->
      <ion-button class="registro-form" expand="block" fill="outline" (click)="downloadPdf()">
        Descargar datos en PDF
      </ion-button>
    }
  </div>
</ion-content>
