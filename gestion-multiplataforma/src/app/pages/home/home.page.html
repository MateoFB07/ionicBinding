<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Inicio</ion-title>
    <ion-buttons slot="start">
      <ion-button routerLink="/dashboard">Inicio</ion-button>
      <ion-button routerLink="/usuarios">Usuarios</ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <!-- Botón Modo Oscuro / Claro -->
      <ion-button (click)="toggleModoOscuro()">
        <ion-icon slot="icon-only" [name]="esModoOscuro() ? 'sunny-outline' : 'moon-outline'"></ion-icon>
      </ion-button>
      <ion-button (click)="logout()">Salir</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <div class="header-bienvenida ion-margin-bottom">
    <h1 class="titulo-bienvenida">Te damos la bienvenida, Administrador</h1>
    <ion-chip color="primary">
      <ion-label>Admin</ion-label>
    </ion-chip>
  </div>

  @if (cargando()) {
    <div class="contenedor-spinner ion-text-center ion-padding-top">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
      <p>Cargando métricas del sistema...</p>
    </div>
  } @else {

    <!-- Grid de Widgets Estadísticos -->
    <ion-grid class="ion-no-padding ion-margin-bottom">
      <ion-row>
        <ion-col size="12" size-md="6" class="ion-padding-end">
          <app-widget-estadistico
            titulo="Total Empleados"
            [valor]="totalEmpleados"
            subtitulo="Plantilla Registrada"
            colorBorde="#3880ff">
          </app-widget-estadistico>
        </ion-col>
        <ion-col size="12" size-md="6" class="ion-padding-start">
          <app-widget-estadistico
            titulo="Salario Total"
            [valor]="(totalMasaSalarial | currency:'EUR':'symbol':'1.0-0') ?? ''"
            subtitulo="Presupuesto Anual"
            colorBorde="#2dd36f">
          </app-widget-estadistico>
        </ion-col>
      </ion-row>
    </ion-grid>

    <!-- Gráfico Doughnut con Chart.js -->
    <ion-card class="card-grafico ion-no-margin ion-margin-top">
      <ion-card-header>
        <ion-card-title class="titulo-tarjeta">Distribución de la Plantilla por Rol</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <div style="position: relative; height: 300px; width: 100%;">
          <canvas #graficoMasaSalarial></canvas>
        </div>
      </ion-card-content>
    </ion-card>

  }

</ion-content>
