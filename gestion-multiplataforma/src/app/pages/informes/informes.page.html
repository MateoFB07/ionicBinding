<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Informes</ion-title>
  </ion-toolbar>
  <app-navegacion></app-navegacion>
</ion-header>

<ion-content class="ion-padding">
  <main class="reports-page">
    <p class="eyebrow">GESTIÓN DEL EQUIPO</p>
    <h1>Informes</h1>
    <p class="description">Exporta el listado actualizado de empleados desde Supabase.</p>

    @if (cargando()) {
      <div class="loading-state">
        <ion-spinner name="crescent" color="primary"></ion-spinner>
        <span>Cargando datos...</span>
      </div>
    } @else {
      <section class="report-card">
        <div>
          <h2>Listado de usuarios</h2>
          <p>{{ empleados().length }} empleados incluidos en el informe.</p>
        </div>
        <div class="actions">
          <ion-button
            color="primary"
            (click)="exportarPdf()"
            [disabled]="empleados().length === 0">
            Exportar a PDF
          </ion-button>
          <ion-button
            fill="outline"
            (click)="exportarCsv()"
            [disabled]="empleados().length === 0">
            Exportar a CSV
          </ion-button>
        </div>
      </section>

      <ion-button fill="clear" routerLink="/usuarios">Volver a usuarios</ion-button>
    }
  </main>
</ion-content>
