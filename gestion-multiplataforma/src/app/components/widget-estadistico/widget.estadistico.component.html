<ion-card 
  [style.border-left]="'5px solid ' + colorBorde" 
  class="ion-no-margin"
  (click)="notificarClic()">
  <ion-card-header>
    @if (subtitulo) {
      <ion-card-subtitle>{{ subtitulo }}</ion-card-subtitle>
    }
    <ion-card-title>{{ titulo }}</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <h2 style="font-size: 2rem; font-weight: bold; margin: 0; color: var(--ion-color-dark);">
      {{ valor }}
    </h2>
  </ion-card-content>
</ion-card>
